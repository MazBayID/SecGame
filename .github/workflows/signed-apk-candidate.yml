name: Signed APK Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-signed-apk-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: Validate, build once, and smoke-test exact Release APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AEGIS_RELEASE_STORE_FILE: ${{ runner.temp }}/aegis-release.jks
      AEGIS_RELEASE_STORE_PASSWORD: ${{ secrets.AEGIS_RELEASE_STORE_PASSWORD }}
      AEGIS_RELEASE_KEY_ALIAS: ${{ secrets.AEGIS_RELEASE_KEY_ALIAS }}
      AEGIS_RELEASE_KEY_PASSWORD: ${{ secrets.AEGIS_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout main candidate commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate required signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.AEGIS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing AEGIS_RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$AEGIS_RELEASE_STORE_PASSWORD" || { echo "Missing AEGIS_RELEASE_STORE_PASSWORD secret"; exit 1; }
          test -n "$AEGIS_RELEASE_KEY_ALIAS" || { echo "Missing AEGIS_RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$AEGIS_RELEASE_KEY_PASSWORD" || { echo "Missing AEGIS_RELEASE_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$AEGIS_RELEASE_STORE_FILE"
          test -s "$AEGIS_RELEASE_STORE_FILE"

      - name: Run Kotlin JVM unit tests
        run: gradle :app:testDebugUnitTest

      - name: Check Python test applicability
        run: |
          set -euo pipefail
          if [ -d python ] || [ -d app/src/main/python ]; then
            echo "Python sources detected. Add and run the project's Python test suite before enabling candidate builds."
            exit 1
          fi
          echo "No Python runtime/source is present in this foundation commit; Python test suite is not applicable yet."

      - name: Build the single signed Release APK
        run: gradle :app:assembleRelease

      - name: Validate APK signature, package, version, and ABI
        id: apk
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH")"
          echo "$BADGING" | grep -F "package: name='com.mazbayid.aegisnet'"
          VERSION_CODE="$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p")"
          test -n "$VERSION_CODE" && test "$VERSION_CODE" -gt 0
          printf 'Validated versionCode=%s\\n' "$VERSION_CODE"
          if printf '%s' "$BADGING" | grep -q "native-code:"; then
            printf '%s\\n' "$BADGING" | grep "native-code:"
          else
            echo "No native libraries declared; APK is ABI-independent."
          fi
          sha256sum "$APK_PATH" | tee app-release.apk.sha256
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Emulator smoke test — exact candidate APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Pixel_2
          script: |
            set -euo pipefail
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            adb install -r "$APK_PATH"
            adb logcat -c
            adb shell am force-stop com.mazbayid.aegisnet
            adb shell am start -W -n com.mazbayid.aegisnet/.MainActivity
            sleep 5
            adb shell pidof com.mazbayid.aegisnet
            if adb logcat -d -t 1000 | grep -F "FATAL EXCEPTION"; then
              echo "Application crashed during smoke test."
              exit 1
            fi
            sha256sum "$APK_PATH" > /tmp/apk-after-smoke.sha256
            sha256sum -c app-release.apk.sha256

      - name: Upload the exact tested candidate APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: aegis-net-release-candidate-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
