name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - ".gitignore"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - ".gitignore"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and upload a debug APK after tests pass"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests and source validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate POC scripts
        run: |
          bash -n tools/prepare_pyodide_core.sh
          bash -n tools/validate_runtime_poc.sh
          bash tools/validate_runtime_poc.sh
          node --check --input-type=module < app/src/debug/assets/runtime-poc/host.js
          node --check --input-type=module < app/src/debug/assets/runtime-poc/worker.js
          node --check --input-type=module < app/src/debug/assets/runtime-poc/python-worker.js
          node --check tools/test_pyodide_runtime.mjs

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

  runtime-smoke:
    name: Real Pyodide runtime smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare pinned Pyodide core assets
        run: bash tools/prepare_pyodide_core.sh

      - name: Execute real Python runtime tests
        run: node tools/test_pyodide_runtime.mjs

      - name: Upload verified Pyodide core assets
        uses: actions/upload-artifact@v4
        with:
          name: pyodide-core-assets
          path: app/src/debug/assets/runtime-poc/pyodide/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Build debug APK
    needs: [validate, runtime-smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Download verified Pyodide core assets
        uses: actions/download-artifact@v4
        with:
          name: pyodide-core-assets
          path: app/src/debug/assets/runtime-poc/pyodide/

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cyber-trace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
