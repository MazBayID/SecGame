name: Installable Debug APK Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-debug-apk-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: Test and build one installable Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "APK candidates may only be built from main."
            exit 1
          }

      - name: Checkout candidate commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Kotlin JVM unit tests
        run: gradle :app:testDebugUnitTest

      - name: Check Python test applicability
        run: |
          set -euo pipefail
          if [ -d python ] || [ -d app/src/main/python ]; then
            echo "Python sources detected. Add and run the project's Python test suite before enabling candidate builds."
            exit 1
          fi
          echo "No Python runtime/source is present; Python tests are not applicable yet."

      - name: Build exactly one installable Debug APK
        run: gradle :app:assembleDebug

      - name: Validate APK, package metadata, and automatic debug signature
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          unzip -t "$APK_PATH"

          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH")"
          echo "$BADGING" | grep -F "package: name='com.mazbayid.aegisnet'"
          VERSION_CODE="$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p")"
          test -n "$VERSION_CODE" && test "$VERSION_CODE" -gt 0
          printf 'Validated Debug APK versionCode=%s\\n' "$VERSION_CODE"

          CERT_INFO="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH")"
          echo "$CERT_INFO"
          printf '%s' "$CERT_INFO" | grep -F "Android Debug"

          if printf '%s' "$BADGING" | grep -q "native-code:"; then
            printf '%s\\n' "$BADGING" | grep "native-code:"
          else
            echo "No native libraries declared; APK is ABI-independent."
          fi

          sha256sum "$APK_PATH" | tee app-debug.apk.sha256

      - name: Upload installable Debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: aegis-net-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
